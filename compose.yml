services:
  app-service:
    image: zdannar/app-service # specify name of image on Docker Hub
    restart: "always" # automatically restart container when server crashes
    environment: # set up environment variables
      AUTH_SERVICE_IP: ${AUTH_SERVICE_IP:-localhost} # Use localhost as the default value
    ports:
      - "8000:8000" # expose port 8000 so that applications outside the container can connect to it 
    depends_on: # only run app-service after auth-service has started
      auth-service:
        condition: service_started
  auth-service:
    image: zdannar/auth-service
    restart: "always" # automatically restart container when server crashes
    ports:
      - "3000:3000" # expose port 3000 so that applications outside the container can connect to it 
    environment: # set up environment variables
      JWT_SECRET: DC+NkYEHNSMSmDpdCsWZsU4NYLr0g9vVx5OmyN1s1waplf2g4fucelS6iWXgFAuu
      DATABASE_URL: "postgres://postgres:password@db:5432"
    depends_on:
      - db
  db:
    image: postgres:15.2-alpine
    restart: always
    environment:
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - db:/var/lib/postgresql/data

# New!
volumes:
  db:
    driver: local
